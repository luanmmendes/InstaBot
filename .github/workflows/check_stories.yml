name: Check Cinema Stories

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:       # allows manual run from GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python check_stories.py
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CINEMA_ACCOUNT:   ${{ secrets.CINEMA_ACCOUNT }}
          APIFY_TOKEN:      ${{ secrets.APIFY_TOKEN }}

      - name: Save already_sent.json back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -f already_sent.json ]; then
            git add already_sent.json
            git diff --cached --quiet || git commit -m "Update already_sent.json"
            git push
          else
            echo "No new stories found, nothing to save."
          fi
